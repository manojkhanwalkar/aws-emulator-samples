# Logging for the samples (slf4j-simple). The AWS SDK logs a lot at DEBUG; keep it to warnings so the
# samples' own output is easy to read. Change "warn" to "debug" to see every HTTP request the SDK sends.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.showDateTime=false
org.slf4j.simpleLogger.showThreadName=false
